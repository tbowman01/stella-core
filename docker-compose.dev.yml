version: '3.8'

# Development docker-compose with hot-reload and debugging

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arcqubit-postgres-dev
    environment:
      POSTGRES_USER: arcqubit
      POSTGRES_PASSWORD: arcqubit_dev
      POSTGRES_DB: arcqubit
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - arcqubit-dev

  redis:
    image: redis:7-alpine
    container_name: arcqubit-redis-dev
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    networks:
      - arcqubit-dev

  minio:
    image: minio/minio:latest
    container_name: arcqubit-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arcqubit
      MINIO_ROOT_PASSWORD: arcqubit_minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_dev_data:/data
    networks:
      - arcqubit-dev

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:

networks:
  arcqubit-dev:
    driver: bridge
