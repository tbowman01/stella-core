apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arcqubit.fullname" . }}-config
  labels:
    {{- include "arcqubit.labels" . | nindent 4 }}
data:
  # Application metadata
  APP_NAME: "ArcQubit Knowledge Work Platform"
  APP_VERSION: {{ .Chart.AppVersion | quote }}

  # Feature flags
  ENABLE_PLUGINS: {{ .Values.config.features.enablePlugins | quote }}
  ENABLE_AI_ASSISTANT: {{ .Values.config.features.enableAIAssistant | quote }}
  ENABLE_PQC: {{ .Values.config.features.enablePQC | quote }}
  ENABLE_SSO: {{ .Values.config.features.enableSSO | quote }}
  ENABLE_MFA: {{ .Values.config.features.enableMFA | quote }}

  # Rate limiting
  RATE_LIMIT_WINDOW_MS: {{ .Values.config.rateLimit.windowMs | quote }}
  RATE_LIMIT_MAX_REQUESTS: {{ .Values.config.rateLimit.maxRequests | quote }}
  AUTH_RATE_LIMIT_MAX_REQUESTS: {{ .Values.config.rateLimit.authMaxRequests | quote }}

  # Cache configuration
  CACHE_TTL_USER: {{ .Values.config.cache.userTTL | quote }}
  CACHE_TTL_DOCUMENT: {{ .Values.config.cache.documentTTL | quote }}
  CACHE_TTL_SEARCH: {{ .Values.config.cache.searchTTL | quote }}

  # File upload configuration
  MAX_FILE_SIZE: {{ .Values.config.upload.maxFileSize | quote }}
  ALLOWED_MIME_TYPES: {{ join "," .Values.config.upload.allowedMimeTypes | quote }}

  # Storage configuration
  STORAGE_PROVIDER: {{ .Values.storage.provider | quote }}
  S3_BUCKET: {{ .Values.storage.bucket | quote }}
  S3_REGION: {{ .Values.storage.region | quote }}
  {{- if .Values.storage.endpoint }}
  S3_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  {{- end }}
