{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "arcqubit.fullname" . }}-secrets
  labels:
    {{- include "arcqubit.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}

  refreshInterval: {{ .Values.externalSecrets.secrets.0.refreshInterval }}

  target:
    name: {{ include "arcqubit.fullname" . }}-secrets
    creationPolicy: Owner

  data:
    {{- range .Values.externalSecrets.secrets }}
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
    {{- end }}
    {{- end }}
{{- else }}
---
# Manual secret - you must create this manually when externalSecrets is disabled
# kubectl create secret generic {{ include "arcqubit.fullname" . }}-secrets \
#   --from-literal=JWT_SECRET='your-secret-here' \
#   --from-literal=DATABASE_PASSWORD='your-password-here' \
#   --from-literal=REDIS_PASSWORD='your-password-here' \
#   --from-literal=S3_ACCESS_KEY='your-access-key-here' \
#   --from-literal=S3_SECRET_KEY='your-secret-key-here'
{{- end }}
