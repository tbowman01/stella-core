apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager-staging
  namespace: arcqubit-staging
  labels:
    app.kubernetes.io/name: arcqubit
    app.kubernetes.io/component: secrets
    environment: staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1

      # Use IRSA (IAM Roles for Service Accounts)
      auth:
        jwt:
          serviceAccountRef:
            name: arcqubit

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-staging
  labels:
    app.kubernetes.io/name: arcqubit
    app.kubernetes.io/component: secrets
    environment: staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1

      auth:
        jwt:
          serviceAccountRef:
            name: arcqubit
            namespace: arcqubit-staging
