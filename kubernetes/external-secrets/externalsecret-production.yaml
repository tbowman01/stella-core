apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arcqubit-secrets
  namespace: arcqubit-production
  labels:
    app.kubernetes.io/name: arcqubit
    app.kubernetes.io/component: secrets
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Sync before other resources
spec:
  # Refresh secrets every hour
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager-production
    kind: SecretStore

  target:
    name: arcqubit-secrets
    creationPolicy: Owner
    deletionPolicy: Retain

    # Template for additional processing
    template:
      engineVersion: v2
      data:
        # JWT configuration
        JWT_SECRET: "{{ .JWT_SECRET }}"
        JWT_EXPIRY: "3600"
        JWT_REFRESH_EXPIRY: "604800"

        # Database configuration
        DATABASE_PASSWORD: "{{ .DATABASE_PASSWORD }}"
        DATABASE_URL: "postgresql://arcqubit:{{ .DATABASE_PASSWORD }}@arcqubit-production-postgresql:5432/arcqubit_production"

        # Redis configuration
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        REDIS_URL: "redis://:{{ .REDIS_PASSWORD }}@arcqubit-production-redis-master:6379"

        # S3 configuration
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"

        # Monitoring
        SENTRY_DSN: "{{ .SENTRY_DSN }}"
        DATADOG_API_KEY: "{{ .DATADOG_API_KEY }}"

  data:
    # JWT Secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: arcqubit/production/jwt-secret

    # Database credentials
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: arcqubit/production/database-password

    # Redis credentials
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: arcqubit/production/redis-password

    # S3 credentials
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: arcqubit/production/s3-access-key

    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: arcqubit/production/s3-secret-key

    # Monitoring
    - secretKey: SENTRY_DSN
      remoteRef:
        key: arcqubit/production/sentry-dsn

    - secretKey: DATADOG_API_KEY
      remoteRef:
        key: arcqubit/production/datadog-api-key

---
# Additional secrets for production-specific integrations
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arcqubit-integrations
  namespace: arcqubit-production
  labels:
    app.kubernetes.io/name: arcqubit
    app.kubernetes.io/component: secrets
    environment: production
spec:
  refreshInterval: 6h

  secretStoreRef:
    name: aws-secrets-manager-production
    kind: SecretStore

  target:
    name: arcqubit-integrations
    creationPolicy: Owner

  dataFrom:
    - find:
        name:
          regexp: ^arcqubit/production/integrations/.*

---
# TLS certificates (if not using cert-manager)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arcqubit-tls
  namespace: arcqubit-production
  labels:
    app.kubernetes.io/name: arcqubit
    app.kubernetes.io/component: secrets
    environment: production
spec:
  refreshInterval: 24h

  secretStoreRef:
    name: aws-secrets-manager-production
    kind: SecretStore

  target:
    name: arcqubit-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls

  data:
    - secretKey: tls.crt
      remoteRef:
        key: arcqubit/production/tls-certificate

    - secretKey: tls.key
      remoteRef:
        key: arcqubit/production/tls-private-key
