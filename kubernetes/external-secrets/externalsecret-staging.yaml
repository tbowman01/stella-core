apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arcqubit-secrets
  namespace: arcqubit-staging
  labels:
    app.kubernetes.io/name: arcqubit
    app.kubernetes.io/component: secrets
    environment: staging
spec:
  # Refresh secrets every hour
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager-staging
    kind: SecretStore

  target:
    name: arcqubit-secrets
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    # JWT Secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: arcqubit/staging/jwt-secret

    # Database credentials
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: arcqubit/staging/database-password

    # Redis credentials
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: arcqubit/staging/redis-password

    # S3 credentials
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: arcqubit/staging/s3-access-key

    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: arcqubit/staging/s3-secret-key

    # Monitoring
    - secretKey: SENTRY_DSN
      remoteRef:
        key: arcqubit/staging/sentry-dsn

---
# Additional secrets for staging-specific integrations
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arcqubit-integrations
  namespace: arcqubit-staging
  labels:
    app.kubernetes.io/name: arcqubit
    app.kubernetes.io/component: secrets
    environment: staging
spec:
  refreshInterval: 6h

  secretStoreRef:
    name: aws-secrets-manager-staging
    kind: SecretStore

  target:
    name: arcqubit-integrations
    creationPolicy: Owner

  dataFrom:
    - find:
        name:
          regexp: ^arcqubit/staging/integrations/.*
