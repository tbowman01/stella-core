apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arcqubit-staging

# Base resources
resources:
  - ../../base

# Patches for staging environment
patches:
  # Patch application for staging
  - target:
      kind: Application
      name: arcqubit
    patch: |-
      - op: replace
        path: /metadata/name
        value: arcqubit-staging
      - op: replace
        path: /spec/source/targetRevision
        value: main
      - op: replace
        path: /spec/source/helm/valueFiles
        value:
          - values.yaml
          - values-staging.yaml
      - op: add
        path: /spec/source/helm/parameters
        value:
          - name: image.tag
            value: staging
          - name: ingress.hosts[0].host
            value: staging.arcqubit.example.com
      - op: replace
        path: /spec/destination/namespace
        value: arcqubit-staging
      - op: replace
        path: /metadata/labels/environment
        value: staging
      - op: replace
        path: /spec/info/0/value
        value: https://staging.arcqubit.example.com

# Labels to add to all resources
commonLabels:
  environment: staging
  managed-by: argocd

# Annotations to add to all resources
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
  notifications.argoproj.io/subscribe.on-sync-succeeded.slack: arcqubit-deployments
